<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მაფია</title>
    <style>
        :root {
            --bg: #0f1115;
            --surface: #181a20;
            --surface-hover: #21242c;
            --border: #2a2d37;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #e11d48;
            --accent-hover: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .app-card {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: 28px;
            padding: 32px 24px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 24px;
        }

        .roles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
            text-align: left;
        }

        .role-option {
            background: var(--bg);
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .role-option:hover {
            background: var(--surface-hover);
        }

        .role-option:has(input:checked) {
            border-color: var(--accent);
            background: rgba(225, 29, 72, 0.1);
        }

        .role-option input {
            accent-color: var(--accent);
            width: 20px;
            height: 20px;
            cursor: pointer;
            border-radius: 4px;
        }

        .role-label-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-text {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .status-text span {
            color: var(--text-primary);
            font-weight: 700;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: -0.01em;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-primary:disabled {
            background: #232630;
            color: #4b5563;
            cursor: not-allowed;
        }

        .btn-success {
            background: #10b981;
            color: #ffffff;
            margin-top: 18px;
        }

        .btn-success:hover {
            background: #059669;
        }

        .card-box {
            background: var(--bg);
            border-radius: 20px;
            padding: 50px 20px;
            margin: 24px 0;
            border: 1px solid var(--border);
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .role-title-display {
            font-size: 36px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .hidden {
            display: none !important;
        }

        h2#player-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

<div class="app-card">
    <!-- 1. როლების არჩევის ეკრანი -->
    <div id="setup-screen">
        <h1>მაფია</h1>
        <p class="subtitle">აირჩიეთ თამაშის როლები</p>
        
        <div class="roles-grid" id="roles-list"></div>
        
        <div class="status-text">არჩეულია: <span id="selected-count">0</span> / 14 როლი</div>
        <button class="btn btn-primary" id="start-btn" onclick="startGame()" disabled>თამაშის დაწყება</button>
    </div>

    <!-- 2. ბარათების გადაცემის ეკრანი -->
    <div id="game-screen" class="hidden">
        <h2 id="player-title">მოთამაშე 1</h2>
        
        <div class="card-box">
            <button class="btn btn-primary" id="reveal-btn" onclick="revealRole()">როლის ნახვა</button>
            <div id="role-content" class="hidden">
                <div class="role-title-display" id="role-display"></div>
            </div>
        </div>

        <button class="btn btn-success hidden" id="next-btn" onclick="nextPlayer()">შემდეგი მოთამაშე</button>
    </div>
</div>

<script>
    const rolesData = [
        { name: "დონი", listLabel: "დონი" },
        { name: "მაფია", listLabel: "მაფია 1" },
        { name: "მაფია", listLabel: "მაფია 2" },
        { name: "იაკუძა", listLabel: "იაკუძა" },
        { name: "შოგუნი", listLabel: "შოგუნი" },
        { name: "დეტექტივი", listLabel: "დეტექტივი" },
        { name: "ექიმი", listLabel: "ექიმი" },
        { name: "მანიაკი", listLabel: "მანიაკი" },
        { name: "მოქალაქე", listLabel: "მოქალაქე" },
        { name: "მოქალაქე", listLabel: "მოქალაქე 1" },
        { name: "მოქალაქე", listLabel: "მოქალაქე 2" },
        { name: "მოქალაქე", listLabel: "მოქალაქე 3" },
        { name: "მოქალაქე", listLabel: "მოქალაქე 4" },
        { name: "მოქალაქე", listLabel: "მოქალაქე 5" }
    ];

    let assignedRoles = [];
    let currentIndex = 0;

    const listContainer = document.getElementById('roles-list');
    rolesData.forEach((roleObj, index) => {
        const label = document.createElement('label');
        label.className = 'role-option';
        label.innerHTML = `
            <input type="checkbox" value="${index}" onchange="updateCount()">
            <span class="role-label-text">${roleObj.listLabel}</span>
        `;
        listContainer.appendChild(label);
    });

    function updateCount() {
        const checkedBoxes = document.querySelectorAll('#roles-list input[type="checkbox"]:checked');
        const count = checkedBoxes.length;
        document.getElementById('selected-count').innerText = count;
        document.getElementById('start-btn').disabled
