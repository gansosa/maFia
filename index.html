როგორც ითხოვეთ, ამოვშალე სურათები/ლოგოები და დავტოვე მხოლოდ სუფთა, ლამაზი ტექსტური სახელები.

აი სრული განახლებული კოდი:

```html
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მაფია - როლების განაწილება</title>
    <style>
        :root {
            --bg-color: #0c0c0e;
            --container-bg: #16161b;
            --border-color: #262630;
            --accent-red: #ff334b;
            --accent-red-glow: rgba(255, 51, 75, 0.3);
            --accent-gold: #ffc107;
            --text-main: #f0f0f5;
            --text-secondary: #9999a6;
            --card-bg: #1f1f26;
            --card-selected-bg: #2a161c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 460px;
            background: var(--container-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h1 {
            color: var(--accent-red);
            font-size: 30px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-red-glow);
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .roles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            text-align: left;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Custom Scrollbar */
        .roles-grid::-webkit-scrollbar {
            width: 5px;
        }
        .roles-grid::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .role-option {
            background: var(--card-bg);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.25s ease;
        }

        .role-option:hover {
            border-color: #444455;
            transform: translateY(-1px);
        }

        .role-option:has(input:checked) {
            border-color: var(--accent-red);
            background: var(--card-selected-bg);
            box-shadow: 0 0 10px rgba(255, 51, 75, 0.15);
        }

        .role-option input {
            accent-color: var(--accent-red);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .role-label-text {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-text {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .status-text span {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 5px 20px var(--accent-red-glow);
        }

        .btn-primary:hover {
            background: #ff1935;
            box-shadow: 0 8px 25px rgba(255, 51, 75, 0.5);
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            background: #23232c;
            color: #555566;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-success {
            background: #00c853;
            color: #fff;
            margin-top: 15px;
            box-shadow: 0 5px 20px rgba(0, 200, 83, 0.3);
        }

        .btn-success:hover {
            background: #00e676;
            transform: translateY(-2px);
        }

        .card-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px 20px;
            margin: 20px 0;
            border: 2px dashed #363645;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .role-title-display {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-gold);
            text-shadow: 0 0 15px rgba(255, 193, 7, 0.4);
            letter-spacing: 1px;
        }

        .hidden {
            display: none !important;
        }

        h2#player-title {
            letter-spacing: 0.5px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 1. როლების არჩევის ეკრანი -->
    <div id="setup-screen">
        <h1>მაფია</h1>
        <p class="subtitle">მონიშნეთ თამაშში მონაწილე როლები</p>
        
        <div class="roles-grid" id="roles-list"></div>
        
        <div class="status-text">არჩეულია: <span id="selected-count">0</span> / 14 როლი</div>
        <button class="btn btn-primary" id="start-btn" onclick="startGame()" disabled>თამაშის დაწყება</button>
    </div>

    <!-- 2. ბარათების გადაცემის ეკრანი -->
    <div id="game-screen" class="hidden">
        <h2 id="player-title" style="color: #ffffff; font-size: 20px; margin-bottom: 5px;">მოთამაშე 1</h2>
        
        <div class="card-box">
            <button class="btn btn-primary" id="reveal-btn" onclick="revealRole()">როლის ნახვა</button>
            <div id="role-content" class="hidden">
                <div class="role-title-display" id="role-display"></div>
            </div>
        </div>

        <button class="btn btn-success hidden" id="next-btn" onclick="nextPlayer()">შემდეგი მოთამაშე</button>
    </div>
</div>

<script>
    // მხოლოდ ტექსტური როლები
    const rolesData = [
        { name: "დონი", listLabel: "დონი" },
        { name: "მაფია", listLabel: "მაფია 1" },
        { name: "მაფია", listLabel: "მაფია 2" },
        { name: "იაკუძა", listLabel: "იაკუძა" },
        { name: "შოგუნი", listLabel: "შოგუნი" },
        { name: "დეტექტივი", listLabel: "დეტექტივი" },
        { name: "ექიმი", listLabel: "ექიმი" },
        { name: "მანიაკი", listLabel: "მანიაკი" },
        { name: "მოქალაქე", listLabel: "მოქალაქე" },
        { name: "მოქალაქე", listLabel: "მოქალაქე 1" },
        { name: "მოქალაქე", listLabel: "მოქალაქე 2" },
        { name: "მოქალაქე", listLabel: "მოქალაქე 3" },
        { name: "მოქალაქე", listLabel: "მოქალაქე 4" },
        { name: "მოქალაქე", listLabel: "მოქალაქე 5" }
    ];

    let assignedRoles = [];
    let currentIndex = 0;

    // ჩექბოქსების გენერაცია სურათების გარეშე
    const listContainer = document.getElementById('roles-list');
    rolesData.forEach((roleObj, index) => {
        const label = document.createElement('label');
        label.className = 'role-option';
        label.innerHTML = `
            <input type="checkbox" value="${index}" onchange="updateCount()">
            <span class="role-label-text">${roleObj.listLabel}</span>
        `;
        listContainer.appendChild(label);
    });

    function updateCount() {
        const checkedBoxes = document.querySelectorAll('#roles-list input[type="checkbox"]:checked');
        const count = checkedBoxes.length;
        document.getElementById('selected-count').innerText = count;
        document.getElementById('start-btn').disabled = count === 0;
    }

    function startGame() {
        const checkedBoxes = document.querySelectorAll('#roles-list input[type="checkbox"]:checked');
        let selectedRoles = Array.from(checkedBoxes).map(cb => rolesData[cb.value]);

        // როლების არევა
        for (let i = selectedRoles.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [selectedRoles[i], selectedRoles[j]] = [selectedRoles[j], selectedRoles[i]];
        }

        assignedRoles = selectedRoles;
        currentIndex = 0;

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        showPlayerStep();
    }

    function showPlayerStep() {
        document.getElementById('player-title').innerText = `მოთამაშე ${currentIndex + 1}`;
        document.getElementById('role-content').classList.add('hidden');
        document.getElementById('reveal-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');
    }

    function revealRole() {
        const currentRole = assignedRoles[currentIndex];
        document.getElementById('role-display').innerText = currentRole.name;
        
        document.getElementById('role-content').classList.remove('hidden');
        document.getElementById('reveal-btn').classList.add('hidden');
        
        setTimeout(() => {
            document.getElementById('next-btn').classList.remove('hidden');
        }, 300);
    }

    function nextPlayer() {
        currentIndex++;
        if (currentIndex < assignedRoles.length) {
            showPlayerStep();
        } else {
            alert('ყველა მოთამაშემ გაიგო თავისი როლი! თამაში იწყება.');
            location.reload();
        }
    }
</script>

</body>
</html>

```
