<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>მაფია</title>
    
    <!-- აიფონის აპლიკაციის პარამეტრები -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="მაფია">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg: #0f1115;
            --surface: #181a20;
            --surface-hover: #21242c;
            --border: #2a2d37;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #e11d48;
            --accent-hover: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-card {
            width: 100%;
            max-width: 460px;
            background: var(--surface);
            border-radius: 26px;
            padding: 20px 18px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 12px;
        }

        .roles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
            text-align: left;
        }

        .role-option {
            background: var(--bg);
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .role-option:hover {
            background: var(--surface-hover);
        }

        .role-option:has(input:checked) {
            border-color: var(--accent);
            background: rgba(225, 29, 72, 0.1);
        }

        .role-option input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        .role-label-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 400;
        }

        .status-text span {
            color: var(--text-primary);
            font-weight: 700;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: -0.01em;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-primary:disabled {
            background: #232630;
            color: #4b5563;
            cursor: not-allowed;
        }

        .btn-success {
            background: #10b981;
            color: #ffffff;
            margin-top: 14px;
        }

        .btn-success:hover {
            background: #059669;
        }

        .card-box {
            background: var(--bg);
            border-radius: 20px;
            padding: 35px 20px;
            margin: 15px 0;
            border: 1px solid var(--border);
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .role-title-display {
            font-size: 30px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .hidden {
            display: none !important;
        }

        h2#player-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

<div class="app-card">
    <!-- 1. როლების არჩევის ეკრანი -->
    <div id="setup-screen">
        <h1>მაფია</h1>
        <p class="subtitle">აირჩიეთ თამაშის როლები</p>
        
        <div class="roles-grid" id="roles-list"></div>
        
        <div class="status-text">არჩეულია: <span id="selected-count">0</span> / <span id="total-roles-count">16</span> როლი</div>
        <button class="btn btn-primary" id="start-btn" onclick="startGame()" disabled>თამაშის დაწყება</button>
    </div>

    <!-- 2. ბარათების გადაცემის ეკრანი -->
    <div id="game-screen" class="hidden">
        <h2 id="player-title">მოთამაშე 1</h2>
        
        <div class="card-box">
            <button class="btn btn-primary" id="reveal-btn" onclick="revealRole()">როლის ნახვა</button>
            <div id="role-content" class="hidden">
                <div class="role-title-display" id="role-display"></div>
            </div>
        </div>

        <button class="btn btn-success hidden" id="next-btn" onclick="nextPlayer()">შემდეგი მოთამაშე</button>
    </div>
</div>

<script>
